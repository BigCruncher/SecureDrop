services:
  ca_setup:
    build: .
    container_name: ca_setup
    working_dir: /ca
    command:
      - bash
      - -c
      - |
        if [ ! -f ca.key ]; then
          openssl genpkey -algorithm RSA -out ca.key && \
          openssl req -x509 -new -key ca.key -sha256 -days 3650 \
            -out ca.crt -subj '/CN=SecureDrop Test CA' && \
          echo 'CA generated.'
        else
          echo 'CA already exists, skipping.'
        fi
    volumes:
      - ./ca:/ca

  client1:
    build: .
    container_name: client1
    stdin_open: true
    tty: true
    depends_on: [ca_setup]
    environment:
      - CLIENT_NAME=client1
    volumes:
      - ./ca:/ca            # CA cert read-only; ca.key also here for sign-on-register
      - ./data/client1:/data   # per-client persistent state (users.yaml, contacts.yaml)
    working_dir: /data
    networks: [securenet]

  client2:
    build: .
    container_name: client2
    stdin_open: true
    tty: true
    depends_on: [ca_setup]
    environment:
      - CLIENT_NAME=client2
    volumes:
      - ./ca:/ca            # CA cert read-only; ca.key also here for sign-on-register
      - ./data/client2:/data   # per-client persistent state (users.yaml, contacts.yaml)
    working_dir: /data
    networks: [securenet]

  client3:
    build: .
    container_name: client3
    stdin_open: true
    tty: true
    depends_on: [ca_setup]
    environment:
      - CLIENT_NAME=client3
    volumes:
      - ./ca:/ca            # CA cert read-only; ca.key also here for sign-on-register
      - ./data/client3:/data   # per-client persistent state (users.yaml, contacts.yaml)
    working_dir: /data
    networks: [securenet]

networks:
  securenet:
    driver: bridge
